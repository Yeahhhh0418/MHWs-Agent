llm:
  # 模型名 / 接口地址 / 密钥一律从 .env 读（模板见 .env.example）。
  # 这里只记"读哪个环境变量"—— 公开的配置里不放任何具体服务商信息，使用者填自己的。
  # 只要接口是 OpenAI 兼容的，用哪家都行。
  primary:
    model_env: "LLM_MODEL"
    base_url_env: "LLM_BASE_URL"
    api_key_env: "LLM_API_KEY"
    temperature: 0.7
    max_retries: 1        # ← 第1层：自动重试次数
    timeout: 60
  # 备用模型（可选）：主模型调用失败时自动切过去，建议选另一家厂商。
  # .env 里 LLM_FALLBACK_MODEL 留空就等于不用备用。
  fallback:
    model_env: "LLM_FALLBACK_MODEL"
    base_url_env: "LLM_FALLBACK_BASE_URL"
    api_key_env: "LLM_FALLBACK_API_KEY"
    temperature: 0.7
    max_retries: 1
    timeout: 60
embedding:
  # 写模型名，不写本机缓存路径 —— 那个路径是 HF 根据模型名 + 本机缓存目录算出来的，
  # 写死了就把项目绑死在这台机器、这个用户名上（原值里带着 "Yeh Hu"）
  model: "BAAI/bge-small-zh-v1.5"
  device: cpu
  normalize: true

retrieval:
  equipment:
    bm25_k: 4
    vector_k: 12
    vector_score_threshold: 0.4   # ← 新增，值待标定，先随便填
    bm25_weight: 0.5
    vector_weight: 0.5
    rrf_c: 60            # RRF 平滑常数，越大越弱化排名差异
    ensemble_top_n: 12    # 融合后真正保留的条数
  weapon:
    bm25_k: 4
    vector_k: 10
    bm25_weight: 0.5
    vector_weight: 0.5
    vector_score_threshold: 0.4
    rrf_c: 60            # RRF 平滑常数，越大越弱化排名差异
    ensemble_top_n: 10    # 融合后真正保留的条数
  monster:
    bm25_k: 3
    vector_k: 8
    bm25_weight: 0
    vector_weight: 1
    vector_score_threshold: 0.4
    rrf_c: 60            # RRF 平滑常数，越大越弱化排名差异
    ensemble_top_n: 6    # 融合后真正保留的条数
  material:
    bm25_k: 4
    vector_k: 12
    bm25_weight: 0.5
    vector_weight: 0.5
    vector_score_threshold: 0.4
    rrf_c: 60            # RRF 平滑常数，越大越弱化排名差异
    ensemble_top_n: 12    # 融合后真正保留的条数

paths:
  equipment_data: data/Equipment_Crafting_Table.jsonl
  material_data: data/Material_info_Table.jsonl
  monster_data: data/monster.md
  weapon_data: data/Weapon_Crafting_Table.jsonl
  equipment_persist: storage/mh_equipment_chroma_db
  material_persist: storage/mh_material_chroma_db
  monster_persist: storage/mh_monster_chroma_db
  weapon_persist: storage/mh_weapon_chroma_db


graph:
  max_iterations: 8
  # 整轮时长预算（秒）。max_iterations 拦的是"转太多次"，这个拦的是"每轮都慢、累起来太久" ——
  # 实测最慢那次 5 分钟（主模型挂了走备用）。超了不硬杀，改成去 generate 收尾并记降级。
  time_budget_seconds: 300



        

