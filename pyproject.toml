[project]
name = "mhwi-agent"
version = "0.1.0"
description = "《怪物猎人：荒野》攻略问答 Agent：LangGraph 编排 + 四个知识库的混合检索"
readme = "README.md"
authors = [
    { name = "huye", email = "1569703607@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    # LLM 与编排
    "langchain>=1.3",
    "langchain-core>=1.5",
    "langchain-openai>=1.4",      # 主模型和备用模型都走 OpenAI 兼容协议，见 config 的 base_url
    "langgraph>=1.2",

    # 检索
    "langchain-community>=0.4",   # BM25Retriever
    "langchain-classic>=1.0",     # EnsembleRetriever（RRF 融合）
    "langchain-chroma>=1.1",
    "langchain-huggingface>=1.2",
    "sentence-transformers>=5.6", # 本地 BGE 向量；langchain-huggingface 不会自动带它
    "langchain-text-splitters>=1.1",
    "rank-bm25>=0.2",             # BM25Retriever 把它当可选依赖，不显式列会缺

    # 基础设施
    "python-dotenv>=1.2",         # 包名是这个，不是 PyPI 上那个 dotenv
    "pyyaml>=6.0",
    "colorlog>=6.12",
]

[project.scripts]
# 必须写到函数一层：只写 "app.cli" 会拿到模块，不是函数
mhwi-agent = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# uv_build 默认按项目名（mhwi-agent → mhwi_agent）找 src/mhwi_agent/，
# 但我们的代码全在 src/app/ 下，所以得显式指定。
[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"      # 跟 requires-python 保持一致

# 文档和笔记里的 python 代码块是「给人看的例子」，注释列故意对齐过。
# ruff format 默认会连它们一起重排（比如把对齐压平）—— 那种改动混进 commit 里看不出来。
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = [
    "FURB122",   # for 里 f.write —— 项目要求显式循环，不用推导式
    "PERF402",   # 同上
    "DTZ005",    # 结果文件命名用本地时间正好
    "UP037",
]
